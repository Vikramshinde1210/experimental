; =============================================================================
;  pgBouncer configuration
;
;  Pool topology for this POC:
;    - 3 databases on one Postgres cluster
;    - pool_mode = transaction  (most connection-efficient mode)
;    - default_pool_size = 3   → max 9 real server connections (3 × 3 databases)
;    - max_client_conn = 200   → pgBouncer accepts up to 200 client connections
;
;  Result: 9 services × 3 databases = 27 client-side pools, each with 5 idle
;  connections = 135 logical connections → served by just 9 real server connections.
; =============================================================================

; ── Database routing ──────────────────────────────────────────────────────────
[databases]
; Each entry maps a "logical" database name (what clients connect to) to the
; real PostgreSQL database.  pool_size here overrides default_pool_size.
payments_db   = host=postgres port=5432 dbname=payments_db   pool_size=3
ach_db        = host=postgres port=5432 dbname=ach_db        pool_size=3
scheduling_db = host=postgres port=5432 dbname=scheduling_db pool_size=3

; ── pgBouncer process settings ────────────────────────────────────────────────
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; ── Authentication ────────────────────────────────────────────────────────────
; scram-sha-256 is required for Postgres 16+ (md5 is no longer the default).
; userlist.txt must contain PLAINTEXT passwords so pgBouncer can compute the
; scram handshake when connecting to the backend.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ── Pool mode ─────────────────────────────────────────────────────────────────
; session     — one server connection per client session (safest, least efficient)
; transaction — one server connection per transaction   (most efficient)
;               ⚠ breaks: prepared statements (PREPARE/EXECUTE), SET session vars,
;                         advisory locks, LISTEN/NOTIFY, DECLARE CURSOR (without HOLD)
; statement   — one server connection per SQL statement (breaks multi-stmt transactions)
pool_mode = transaction

; ── Connection limits ─────────────────────────────────────────────────────────
; max_client_conn: how many client connections pgBouncer itself accepts
max_client_conn = 200

; default_pool_size: real server connections per (database, user) pair
; overridden per-database in [databases] above
default_pool_size = 3

; min_pool_size: keep at least this many server connections open per pool at idle
min_pool_size = 1

; reserve_pool_size: extra connections allowed during burst; released after reserve_pool_timeout
reserve_pool_size = 1
reserve_pool_timeout = 3.0

; ── Server connection lifecycle ───────────────────────────────────────────────
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 5
server_login_retry = 15

; ── Client connection limits ──────────────────────────────────────────────────
client_idle_timeout = 0
client_login_timeout = 10

; ── Logging ───────────────────────────────────────────────────────────────────
logfile = /var/log/pgbouncer/pgbouncer.log
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
; Log pool stats every N seconds (0 = disabled)
stats_period = 30

; ── Admin console ─────────────────────────────────────────────────────────────
; Connect to the virtual "pgbouncer" database on port 6432 to run SHOW commands:
;   SHOW POOLS;    — server/client connection counts per (database, user)
;   SHOW STATS;    — request rates and latency
;   SHOW CLIENTS;  — connected clients
;   SHOW SERVERS;  — real server connections
admin_users = appuser
stats_users = appuser

; ── Miscellaneous ─────────────────────────────────────────────────────────────
pidfile = /tmp/pgbouncer.pid
ignore_startup_parameters = extra_float_digits,options
